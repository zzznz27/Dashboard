<!doctype html>
<html lang="en" data-theme="clean-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f4f4f1">
  <title>Integration World Map</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles/themes.css">
  <link rel="stylesheet" href="styles/app.css">
  <!-- defer: download in parallel without holding up the page; they still run in this order, before js/app.js. -->
  <script src="vendor/cytoscape.min.js" defer></script>
  <script src="vendor/layout-base.js" defer></script>
  <script src="vendor/cose-base.js" defer></script>
  <script src="vendor/cytoscape-fcose.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <!-- brand-mark:start --><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-hidden="true" class="brand-mark"><defs><mask id="brand-b" maskUnits="userSpaceOnUse" x="-20" y="-20" width="140" height="140"><rect x="-20" y="-20" width="140" height="140" fill="#fff"/><circle cx="50" cy="50" r="26.5" fill="#000"/></mask><mask id="brand-s" maskUnits="userSpaceOnUse" x="-20" y="-20" width="140" height="140"><rect x="-20" y="-20" width="140" height="140" fill="#fff"/><circle cx="81.05" cy="48.48" r="9.5" fill="#000" transform="rotate(20 50 50)"/></mask></defs><circle cx="50" cy="50" r="25" fill="#003F72" opacity="0.22"/><g transform="rotate(-20 50 50)" fill="none" stroke="#003F72" stroke-width="4" stroke-linecap="round"><path d="M8 50 A42 13 0 0 1 92 50" mask="url(#brand-b)"/><path d="M8 50 A42 13 0 0 0 92 50" mask="url(#brand-s)"/></g><circle cx="44" cy="44" r="6.5" fill="#0073CF"/><circle cx="81.05" cy="48.48" r="5.5" fill="#3DB7E4"/></svg><!-- brand-mark:end -->
      <div>
        <h1 id="title">Integration World Map</h1>
        <p id="subtitle"></p>
      </div>
    </div>
    <div class="top-actions">
      <label class="theme-pick">Theme <select id="theme-select"></select></label>
      <div class="segmented" role="group" aria-label="View">
        <button type="button" data-view="map" aria-pressed="true">Map</button>
        <button type="button" data-view="table" aria-pressed="false">Table</button>
      </div>
    </div>
  </header>

  <noscript><p class="noscript">The World Map needs JavaScript. Turn it on in your browser and reload the page.</p></noscript>

  <div id="filters" class="filters" role="search" aria-label="Filter the map">
    <input id="search" type="search" placeholder="Search systems, IDs, data flows" list="search-suggestions" aria-label="Search systems, integration IDs and data flows" autocomplete="off">
    <datalist id="search-suggestions"></datalist>
    <span id="filter-selects" class="filter-selects"></span>
    <button id="clear-filters" type="button" class="ghost" hidden>Clear filters</button>
    <span id="summary" class="summary" aria-live="polite"></span>
  </div>

  <main id="layout" class="layout">
    <section id="stage" class="stage" aria-label="Integration map">
      <button id="skip-table" type="button" class="skip-link">Skip to the table view, which lists the same integrations</button>
      <canvas id="sky" class="sky-layer" aria-hidden="true"></canvas>
      <div id="map" class="map"></div>
      <canvas id="flow" class="flow-layer" aria-hidden="true"></canvas>
      <div id="matrix" class="matrix" hidden></div>
      <div id="table" class="tableview" hidden></div>
      <div id="empty" class="empty" hidden>
        <p id="empty-text">No integrations match these filters.</p>
        <div class="empty-actions">
          <button id="empty-table" type="button" class="ghost" hidden>Show them in the table</button>
          <button id="empty-clear" type="button" class="ghost">Clear filters</button>
        </div>
      </div>
      <p id="loading" class="loading" role="status">Loading the map…</p>
      <div id="load-error" class="empty load-error" role="alert" hidden></div>
      <div class="stage-tools" id="stage-tools">
        <button id="zoom-in" type="button" class="ghost small" aria-label="Zoom in" title="Zoom in">+</button>
        <button id="zoom-out" type="button" class="ghost small" aria-label="Zoom out" title="Zoom out">−</button>
        <button id="fit" type="button" class="ghost small" title="Fit the whole map in view">Fit</button>
        <button id="settings-button" type="button" class="ghost small" aria-haspopup="true" aria-expanded="false" aria-controls="settings-menu" aria-label="Map settings" title="Map settings">⚙</button>
        <div id="settings-menu" class="settings-menu" role="group" aria-label="Map settings" hidden></div>
      </div>
      <aside id="legend" class="legend" aria-label="Legend"></aside>
    </section>
    <aside id="panel" class="panel" hidden aria-label="Details"></aside>
  </main>

  <footer id="footer" class="footer"></footer>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <p id="sr-status" class="sr-only" role="status"></p>
  <div id="lab" class="lab" hidden></div>
</body>
</html>
